; WILD HEARTS Shader Pre-compiler settings
; Restart the game after a change. 1 = on, 0 = off.
; Delete this file to get the defaults back.

[Overlay]
; Show progress in the top-left corner until the shaders are ready.
Enabled=1

[Replay]
; At startup, rebuild the pipelines the game built on earlier launches.
Enabled=1

[Precompile]
; At startup, build every shader the game ships. The first launch, and the
; first after a game update, also scans the game files (a minute or more).
Enabled=1

[Logging]
; Write WH_SHADERS\logs\wh_pso.log, for troubleshooting.
Enabled=0
; Detail: 1 = summary, 2 = + failures and in-game compiles, 3 = everything.
Level=3
; A progress line every N shader containers (0 = none).
ProgressEvery=500
; Start a new log past this size, in MB.
MaxSizeMB=200

[Performance]
; Thread priority: 0 idle, 1 lowest, 2 below normal, 3 normal (same as
; the game), 4 above normal, 5 highest.
ReplayPriority=3
PrecompilePriority=3
; Threads: -2 = the CPU threads the game isn't using, -1 = all,
; 0 = half, 1-64 = that many.
ReplayThreads=-2
PrecompileThreads=-2
